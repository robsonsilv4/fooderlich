name: fooderlich
description: A Flutter food project.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.9
  google_fonts: ^8.0.0
  provider: ^6.1.5+1
  flutter_colorpicker: ^1.1.0
  intl: ^0.20.0
  uuid: ^4.0.0
  smooth_page_indicator: ^2.0.0
  webview_flutter: ^4.0.0
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/food_pics/
    - assets/magazine_pics/
    - assets/sample_data/
    - assets/profile_pics/
    - assets/fooderlich_assets/
